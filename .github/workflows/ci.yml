name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  GOPRIVATE: github.com/Muxcore-Media/*
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: muxcore
  PGPASSWORD: muxcore
  PGDATABASE: muxcore
  PGSSLMODE: disable

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Configure private modules (HTTPS)
        run: |
          git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muxcore
          POSTGRES_PASSWORD: muxcore
          POSTGRES_DB: muxcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muxcore -d muxcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Configure private modules (HTTPS)
        run: |
          git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: go test -race -count=1 -timeout 10m ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Configure private modules (HTTPS)
        run: |
          git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
