name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GOPROXY: https://proxy.golang.org,direct
  CI: "true"
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: muxcore
  PGPASSWORD: muxcore
  PGDATABASE: muxcore
  PGSSLMODE: disable

jobs:
  test:
    runs-on: native
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          path: database-postgres
      - name: Checkout sibling modules
        run: |
          set -euo pipefail
          git clone --depth 1 https://git.zem.systems/muxcore/core.git core
          git clone --depth 1 https://git.zem.systems/muxcore/contracts-media.git contracts-media
      - name: Start Postgres
        run: |
          set -euo pipefail
          docker rm -f muxcore-pg-ci 2>/dev/null || true
          docker run -d --name muxcore-pg-ci \
            -e POSTGRES_USER=muxcore \
            -e POSTGRES_PASSWORD=muxcore \
            -e POSTGRES_DB=muxcore \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec muxcore-pg-ci pg_isready -U muxcore -d muxcore >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready" >&2
          docker logs muxcore-pg-ci || true
          exit 1
      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
          echo "$HOME/.local/go/bin" >> "$GITHUB_PATH"
      - name: Fetch MuxCore modules from Forgejo origin
        run: |
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
      - working-directory: database-postgres
        run: go test -race -count=1 -timeout 10m ./...
      - name: Stop Postgres
        if: always()
        run: docker rm -f muxcore-pg-ci 2>/dev/null || true

  build:
    runs-on: native
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          path: database-postgres
      - name: Checkout sibling modules
        run: |
          set -euo pipefail
          git clone --depth 1 https://git.zem.systems/muxcore/core.git core
          git clone --depth 1 https://git.zem.systems/muxcore/contracts-media.git contracts-media
      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
          echo "$HOME/.local/go/bin" >> "$GITHUB_PATH"
      - name: Fetch MuxCore modules from Forgejo origin
        run: |
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
      - working-directory: database-postgres
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
